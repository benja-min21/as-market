<!DOCTYPE html>
<html>
<head>
    <title>ICU Project Server</title>
    <style>
        body{
            font-family: Arial;
            background-color:#f2f2f2;
            text-align:center;
        }

        header{
            background:#004080;
            color:white;
            padding:15px;
        }

        .container{
            margin:40px auto;
            width:60%;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input, button{
            padding:10px;
            margin:10px;
            width:80%;
        }

        button{
            background:#004080;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#002b55;
        }

        ul{
            list-style:none;
        }
    </style>
</head>

<body>

<header>
    <h1>ICU PJS</h1>
    <p>ICU Project Server - Student Document Storage</p>
</header>

<div class="container">

    <h2>Upload Document</h2>

    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>

    <h2>Saved Documents</h2>
    <ul id="fileList"></ul>

</div>

<script>
    let files = [];

    function uploadFile(){
        let fileInput = document.getElementById("fileInput");

        if(fileInput.files.length === 0){
            alert("Select a file first");
            return;
        }

        let fileName = fileInput.files[0].name;
        files.push(fileName);

        displayFiles();
    }

    function displayFiles(){
        let list = document.getElementById("fileList");
        list.innerHTML = "";

        files.forEach(file => {
            let li = document.createElement("li");
            li.textContent = file;
            list.appendChild(li);
        });
    }
</script>

</body>
</html>
